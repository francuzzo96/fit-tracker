*{box-sizing:border-box}

<script>
const K="fit-tracker-v1";let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
function norm(x){x=x||{p:{sex:"m",age:30,h:175,act:1.45,goal:0},w:[],ex:[],food:[],water:{},steps:{},runs:[]};
 ["w","ex","food","runs","meas","ev","docs"].forEach(k=>x[k]=x[k]||[]);x.water=x.water||{};x.steps=x.steps||{};return x}
S=norm(S);let dtab="imp";let gd=(new Date().getDay()+6)%7;
let tab="oggi",tI=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("Memoria piena: elimina qualche foto.")}syncSoon()};

/* Sincronizzazione con Supabase: i dati stanno sul dispositivo e in una copia online protetta dal tuo accesso.
   SB_URL e SB_KEY sono l'indirizzo del progetto e la chiave pubblica (fatta per stare nel browser: i dati li protegge la Row Level Security). */
const SB_URL="https://hzjedbtpdxhpfwrawwhn.supabase.co",SB_KEY="sb_publishable_0QLTTjFdVaLFb836rxiNEw_MEzsr39G";
const KB=K+"-base",KR=K+"-rev";let authReady=0,sb=null,me=null,sync={st:"off",at:0,err:""},sT=null,busy=null;
const jeq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const byId=A=>Array.isArray(A)&&A.every(o=>o&&typeof o=="object"&&"id" in o);
/* Unione a tre vie: base = ultima copia sincronizzata. Vince la modifica fatta da una parte sola; se cambia da entrambe, vince questo dispositivo. */
function merge3(b,l,r){if(jeq(l,r))return l;if(jeq(b,l))return r;if(jeq(b,r))return l;
 if(byId(l)&&byId(r)){const B=new Map((byId(b)?b:[]).map(o=>[o.id,o])),R=new Map(r.map(o=>[o.id,o])),L=new Map(l.map(o=>[o.id,o])),out=[];
  l.forEach(o=>{if(R.has(o.id))out.push(merge3(B.get(o.id),o,R.get(o.id)));else if(!B.has(o.id)||!jeq(B.get(o.id),o))out.push(o)});
  r.forEach(o=>{if(!L.has(o.id)&&(!B.has(o.id)||!jeq(B.get(o.id),o)))out.push(o)});return out}
 const ob=x=>x&&typeof x=="object"&&!Array.isArray(x);
 if(ob(l)&&ob(r)){const bb=ob(b)?b:{},out={};new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{
  if(!(k in r)){if(!(k in bb)||!jeq(bb[k],l[k]))out[k]=l[k]}else if(!(k in l)){if(!(k in bb)||!jeq(bb[k],r[k]))out[k]=r[k]}else out[k]=merge3(bb[k],l[k],r[k])});return out}
 return b==null?r:l}/* senza una base comune (primo accesso su un dispositivo) vincono i dati online */
const getBase=()=>{try{return JSON.parse(localStorage.getItem(KB))}catch(e){return null}};
function setBase(d,rev){try{localStorage.setItem(KB,JSON.stringify(d));localStorage.setItem(KR,rev||"")}catch(e){}}
function setSync(st,err){sync={st,at:st=="ok"?Date.now():sync.at,err:err||""};const el=$("syncst");if(el)el.innerHTML=syncTxt()}
function syncTxt(){const t=sync.at?new Date(sync.at).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";
 return {off:"Sincronizzazione non attiva",run:"Sincronizzo…",ok:`✓ Sincronizzato alle ${t}`,net:"Offline: sincronizzo appena torna la connessione",err:`<span style="color:var(--bad)">Errore: ${esc(sync.err)}</span>`}[sync.st]}
function syncSoon(){if(!me)return;clearTimeout(sT);sT=setTimeout(syncNow,1200)}
async function syncNow(){if(!me)return;if(busy)return busy;busy=(async()=>{
 if(!navigator.onLine){setSync("net");return}setSync("run");
 try{for(let i=0;i<3;i++){
  const {data:row,error}=await sb.from("fit_data").select("data,updated_at").eq("user_id",me.id).maybeSingle();if(error)throw error;
  const rev=localStorage.getItem(KR)||"";let local=S;
  if(row&&row.updated_at!==rev){const m=norm(merge3(getBase(),S,row.data));const ch=!jeq(m,S);S=m;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}setBase(row.data,row.updated_at);if(ch)render();local=S;
   if(jeq(S,row.data))break}
  else if(row&&jeq(S,getBase()))break;
  /* scrivo solo se nessun altro dispositivo ha scritto nel frattempo, altrimenti riunisco e riprovo */
  const q=row?sb.from("fit_data").update({data:local}).eq("user_id",me.id).eq("updated_at",row.updated_at):sb.from("fit_data").insert({user_id:me.id,data:local});
  const {data:w,error:e2}=await q.select("updated_at");if(e2&&e2.code!="23505")throw e2;
  if(w&&w.length){setBase(local,w[0].updated_at);break}}
  setSync("ok");upFiles();calSync()}catch(e){setSync(navigator.onLine?"err":"net",e.message||String(e))}})();
 try{await busy}finally{busy=null}}
/* File dei referti: copia online in referti/<utente>/<id>, scaricata quando serve su un altro dispositivo */
async function upFiles(){if(!me)return;let ch=0;for(const d of S.docs)for(const f of d.files){if(f.up)continue;
 try{const b=await fget(f.id);if(!b)continue;const {error}=await sb.storage.from("referti").upload(me.id+"/"+f.id,b,{contentType:f.type,upsert:true});if(error)throw error;f.up=1;ch=1}catch(e){}}
 if(ch)save()}
async function fgetAny(id){let b=null;try{b=await fget(id)}catch(e){}if(b||!me)return b;
 const {data,error}=await sb.storage.from("referti").download(me.id+"/"+id);if(error)return null;try{await fput(id,data)}catch(e){}return data}
async function login(up){const em=v("lem"),pw=$("lpw").value,o=$("lmsg");if(!em||!pw){o.textContent="Scrivi email e password.";return}
 o.textContent=up?"Creo l’account…":"Accedo…";
 const {data,error}=up?await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split("#")[0]}}):await sb.auth.signInWithPassword({email:em,password:pw});
 if(error){o.innerHTML=`<span style="color:var(--bad)">${esc(error.message=="Invalid login credentials"?"Email o password non corrette.":error.message)}</span>`;return}
 if(up&&!data.session)o.textContent="Ti ho mandato un’email: apri il link per confermare l’account, poi accedi qui."}
async function forgot(){const em=v("lem");if(!em){$("lmsg").textContent="Scrivi prima la tua email.";return}
 const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]});$("lmsg").textContent=error?error.message:"Ti ho mandato un’email per scegliere una nuova password."}
async function logout(){if(!confirm("Uscire dall’account su questo dispositivo? I dati restano salvati online."))return;await syncNow();await sb.auth.signOut()}
function vLogin(){return `<div style="max-width:380px;margin:8vh auto 0"><h1>Fit Tracker</h1><p class="sub">Accedi per ritrovare i tuoi dati su iPhone, iPad e computer.</p>
 <div class="card"><label for="lem">Email</label><input id="lem" type="email" autocomplete="username" inputmode="email">
 <label for="lpw" style="margin-top:8px">Password</label><input id="lpw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login(0)">
 <button style="width:100%;margin-top:12px" onclick="login(0)">Accedi</button>
 <button class="g" style="width:100%;margin-top:8px" onclick="forgot()">Password dimenticata</button>
 <p id="lmsg" class="mut" style="margin:10px 0 0" role="status"></p></div>
 <p class="mut">I dati sono salvati sul dispositivo e in una copia online in Europa, visibile solo dopo l’accesso con il tuo account.</p></div>`}
/* Dopo il link d'invito o di recupero: la password la sceglie l'utente qui */
let needPw=/type=(invite|recovery)/.test(location.hash)?1:0;
function vSetPw(){return `<div style="max-width:380px;margin:8vh auto 0"><h1>Scegli la password</h1><p class="sub">${esc(me?me.email:"")}: la userai per accedere da iPhone, iPad e computer.</p>
 <div class="card"><label for="np1">Nuova password (almeno 8 caratteri)</label><input id="np1" type="password" autocomplete="new-password">
 <label for="np2" style="margin-top:8px">Ripetila</label><input id="np2" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')setPw()">
 <button style="width:100%;margin-top:12px" onclick="setPw()">Salva password</button><p id="pmsg" class="mut" style="margin:10px 0 0" role="status"></p></div></div>`}
async function setPw(){const a=$("np1").value,b=$("np2").value,o=$("pmsg");if(a.length<8){o.textContent="Usa almeno 8 caratteri.";return}if(a!==b){o.textContent="Le due password non coincidono.";return}
 o.textContent="Salvo…";const {error}=await sb.auth.updateUser({password:a});if(error){o.innerHTML=`<span style="color:var(--bad)">${esc(error.message)}</span>`;return}
 needPw=0;history.replaceState(null,"",location.pathname);render()}
function accCard(){if(!sb)return `<div class="card"><h2>Account</h2><p class="mut" style="margin:0">${SB_URL?"Sincronizzazione non disponibile: serve la connessione per caricarla la prima volta.":"Sincronizzazione non ancora collegata: i dati restano solo su questo dispositivo."}</p></div>`;
 return `<div class="card"><h2>Account</h2><div class="kv"><span>Accesso</span><span>${esc(me?me.email:"")}</span></div><p id="syncst" class="mut" style="margin:6px 0 10px" role="status">${syncTxt()}</p>
 <div class="row"><button class="g" onclick="syncNow()">Sincronizza ora</button><button class="g" onclick="logout()">Esci</button></div></div>`}
async function startSync(){if(!SB_URL||!window.supabase){render();return}
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 sb.auth.onAuthStateChange((ev,ses)=>{
  if(ev=="PASSWORD_RECOVERY")needPw=1;
  const was=me&&me.id;me=ses?ses.user:null;
  if(me&&me.id!==was){const a=localStorage.getItem(K+"-acct");if(a&&a!==me.id){setBase(null,"");}localStorage.setItem(K+"-acct",me.id);setTimeout(syncNow,0)}
  if(!me)setSync("off");authReady=1;render()});
 addEventListener("online",syncNow);setInterval(()=>{if(me&&!document.hidden)syncNow()},60000)}
const $=id=>document.getElementById(id);
const v=id=>$(id)?$(id).value.trim():"";
const n=id=>parseFloat(v(id).replace(",","."))||0;
const day=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>new Date(d+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const lastW=()=>S.w.length?S.w[S.w.length-1].kg:0;
function bar(val,max,col){return `<div class="bar"><i style="width:${Math.min(100,max?val/max*100:0)}%;background:${col}"></i></div>`}

/* Calcoli */
function target(){const p=S.p,kg=lastW()||70;
 const bmr=10*kg+6.25*p.h-5*p.age+(p.sex=="m"?5:-161);
 const k=Math.round(bmr*p.act+Number(p.goal));
 const pr=Math.round(kg*1.8),f=Math.round(k*.27/9),c=Math.max(0,Math.round((k-pr*4-f*9)/4));
 return {k,pr,f,c}}
function waterTarget(){const kg=lastW()||70;const t=day();
 const act=S.ex.some(e=>e.sets.some(s=>s.d==t));
 return Math.round(kg*35+(act?500:0))}

const DN=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const MS=[["vita","Vita"],["fianchi","Fianchi"],["petto","Petto"],["braccio","Braccio"],["coscia","Coscia"]];
const mi=t=>{const a=t.split(":");return +a[0]*60+ +a[1]};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const wd=d=>(new Date(d+"T12:00").getDay()+6)%7;
const ld=x=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
/* Turni a rotazione: S.rot={types:{M:{n,s,e}},seq:"MMPP…",start:"YYYY-MM-DD" (giorno del primo turno della sequenza)}; S.rotx={data:codice} corregge un singolo giorno */
const ROT0={M:{n:"Mattina",s:"06:00",e:"14:00"},P:{n:"Pomeriggio",s:"14:00",e:"22:00"},N:{n:"Notte",s:"22:00",e:"06:00"},R:{n:"Riposo",s:"",e:""},F:{n:"Ferie",s:"",e:""},X:{n:"Malattia",s:"",e:""}};
const addD=(d,k)=>ld(new Date(Date.parse(d+"T12:00")+k*864e5));
function shiftOn(d){const R=S.rot;if(!R||!R.seq||!R.start)return null;const T={...ROT0,...R.types},x=(S.rotx||{})[d];
 const L=R.seq.length,i=Math.round((Date.parse(d+"T12:00")-Date.parse(R.start+"T12:00"))/864e5),k=x||R.seq[((i%L)+L)%L];return T[k]?{k,...T[k],fix:!!x}:null}
function rotEv(d){if(S.cal&&S.cal.url)return[];const out=[],t=shiftOn(d),y=shiftOn(addD(d,-1));
 if(y&&y.s&&y.e&&y.e<=y.s)out.push({id:"r0"+d,d,s:"00:00",e:y.e,n:y.n+" (fine)",rot:1,sleep:1});
 if(t)out.push({id:"r1"+d,d,s:t.s,e:t.s&&t.e?(t.e<=t.s?"23:59":t.e):"",n:t.n,rot:1,k:t.k,fix:t.fix});return out}

 E.concat([[1320,1320]]).forEach(b=>{if(b[0]-cur>=75)gaps.push([cur,b[0]]);cur=Math.max(cur,b[1])});
 const ev=x=>x[1]-Math.max(x[0],1020)>=75;const g=gaps.find(ev)||gaps.sort((a,b)=>b[1]-b[0]-(a[1]-a[0]))[0];if(!g)return null;

function parseICS(t){t=t.replace(/\r?\n[ \t]/g,"");const out=[];
 const p=s=>{const m=s.match(/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d))?/);if(!m)return null;if(!m[4])return{d:m[1]+"-"+m[2]+"-"+m[3],t:""};if(/Z\s*$/.test(s)){const x=new Date(Date.UTC(m[1],m[2]-1,m[3],m[4],m[5]));return{d:ld(x),t:x.toTimeString().slice(0,5)}}return{d:m[1]+"-"+m[2]+"-"+m[3],t:m[4]+":"+m[5]}};
 t.split("BEGIN:VEVENT").slice(1).forEach(b=>{const g=k=>{const m=b.match(new RegExp("(?:^|\\n)"+k+"[^:\\n]*:([^\\r\\n]*)"));return m?m[1].trim():""};
 const a=p(g("DTSTART")),e=p(g("DTEND"));if(!a)return;const id="ics"+hsh(g("UID")+"|"+g("DTSTART")),n=g("SUMMARY").replace(/\\([,;\\])/g,"$1")||"Evento";
 out.push({id,d:a.d,s:a.t,e:a.t?(e&&e.d==a.d?e.t:"23:59"):"",n,src:1});
 if(a.t&&e&&e.t&&e.d==addD(a.d,1)&&e.t>"00:00")out.push({id:id+"b",d:e.d,s:"00:00",e:e.t,n:n+" (fine)",src:1,sleep:1})});return out}/* turno di notte: la fine va sul giorno dopo */

/* Calendario collegato (es. turni di Supershift copiati in un calendario iCloud pubblico).

const hsh=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};

  if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}
  const from=addD(day(),-31),to=addD(day(),180),L=parseICS(String(data)).filter(x=>x.d>=from&&x.d<=to);

 <input id="calu" type="url" inputmode="url" placeholder="webcal://p…-caldav.icloud.com/published/2/…" autocomplete="off"><button style="width:100%;margin-top:8px" onclick="calOn()">Collega</button><p id="calst" class="mut" style="margin:6px 0 0" role="status"></p></div>`}

 const mn=Math.min(...W.map(x=>x.kg))-1,mx=Math.max(...W.map(x=>x.kg))+1,w=320,h=120;
 const pts=W.map((x,i)=>[10+i*(w-20)/(W.length-1),h-10-(x.kg-mn)/(mx-mn)*(h-20)]);

function vProg(){const p=S.p,W=S.w.slice().reverse(),first=S.w[0],l=S.w[S.w.length-1];
 return `<h1>Progressi</h1><p class="sub">${first&&l&&first!==l?`Dal ${fd(first.d)}: ${(l.kg-first.kg>0?"+":"")+(l.kg-first.kg).toFixed(1)} kg`:"Aggiungi peso e foto per seguire il percorso."}</p>
 <div class="card"><h2>Nuova pesata</h2><div class="row"><div><label>Peso (kg)</label><input id="wk" type="number" step="0.1" inputmode="decimal"></div></div><div class="row" style="margin-top:8px"><div><label>Foto frontale</label><input id="wf" type="file" accept="image/*"></div><div><label>Laterale</label><input id="wl" type="file" accept="image/*"></div><div><label>Retro</label><input id="wb" type="file" accept="image/*"></div></div><button style="width:100%;margin-top:8px" onclick="addW2()">Salva</button></div>
 <div class="card"><h2>Andamento peso</h2>${chart()}</div>
 <div class="card"><h2>Foto e storico</h2>${W.filter(x=>x.img||x.ph).map(x=>{const p=x.ph||{f:x.img};return `<div style="margin-bottom:12px"><div class="mut">${fd(x.d)} · ${x.kg} kg · frontale, laterale, retro</div><div class="grid">${["f","l","b"].map(k=>p[k]?`<img src="${p[k]}" alt="Foto del ${fd(x.d)}">`:"<div></div>").join("")}</div></div>`}).join("")}
 ${W.map(x=>`<div class="item"><span>${fd(x.d)} · <b>${x.kg} kg</b></span><button class="x" onclick="delW('${x.id}')">Elimina</button></div>`).join("")||'<p class="mut">Nessuna pesata.</p>'}</div>
 <div class="card"><h2>Misure (cm)</h2><div class="row">${MS.map(m=>`<div><label>${m[1]}</label><input id="m_${m[0]}" type="number" step="0.1" inputmode="decimal"></div>`).join("")}</div><button style="width:100%;margin-top:8px" onclick="addM()">Salva misure</button>${measList()}</div>
 <div class="card"><h2>I tuoi dati</h2><div class="row"><div><label>Sesso</label><select id="ps"><option value="m" ${p.sex=="m"?"selected":""}>Uomo</option><option value="f" ${p.sex=="f"?"selected":""}>Donna</option></select></div><div><label>Età</label><input id="pa" type="number" value="${p.age}"></div><div><label>Altezza (cm)</label><input id="ph" type="number" value="${p.h}"></div></div>
 <div class="row" style="margin-top:8px"><div><label>Attività</label><select id="pc">${[[1.2,"Sedentario"],[1.375,"Leggera (1-3 allenamenti)"],[1.45,"Media (3-5 allenamenti)"],[1.65,"Alta (6-7 allenamenti)"]].map(a=>`<option value="${a[0]}" ${p.act==a[0]?"selected":""}>${a[1]}</option>`).join("")}</select></div>
 <div><label>Obiettivo</label><select id="pg"><option value="-400" ${p.goal==-400?"selected":""}>Dimagrire</option><option value="0" ${p.goal==0?"selected":""}>Mantenere</option><option value="300" ${p.goal==300?"selected":""}>Aumentare massa</option></select></div></div>
 <button style="width:100%;margin-top:8px" onclick="saveP()">Salva dati</button></div>${accCard()}`}
function saveP(){S.p={sex:v("ps"),age:n("pa")||30,h:n("ph")||175,act:parseFloat(v("pc")),goal:parseInt(v("pg"))};save();render()}
function delW(id){S.w=S.w.filter(x=>x.id!=id);save();render()}
function addWeight(){const kg=n("wk");if(!kg)return;const f=$("wf").files[0];
 const done=img=>{S.w.push({id:uid(),d:day(),kg,img});S.w.sort((a,b)=>a.d<b.d?-1:1);save();render()};
 if(!f)return done(null);
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);done(c.toDataURL("image/jpeg",.6))};im.src=r.result};r.readAsDataURL(f)}

function shrink(f){return new Promise(res=>{if(!f)return res(null);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.55))};im.src=r.result};r.readAsDataURL(f)})}
async function addW2(){const kg=n("wk");if(!kg)return;const ph={f:await shrink($("wf").files[0]),l:await shrink($("wl").files[0]),b:await shrink($("wb").files[0])};S.w.push({id:uid(),d:day(),kg,ph:(ph.f||ph.l||ph.b)?ph:null});S.w.sort((a,b)=>a.d<b.d?-1:1);save();render()}
function addM(){const o={id:uid(),d:day()};let any=0;MS.forEach(m=>{const x=n("m_"+m[0]);if(x){o[m[0]]=x;any=1}});if(!any)return;S.meas.push(o);save();render()}
function lc(A,key){if(A.length<2)return"";const mn=Math.min(...A.map(x=>x[key]))-1,mx=Math.max(...A.map(x=>x[key]))+1,w=320,h=70;const pts=A.map((x,i)=>[10+i*(w-20)/(A.length-1),h-8-(x[key]-mn)/(mx-mn)*(h-16)]);return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Andamento ${key}"><polyline fill="none" stroke="var(--kc)" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/></svg>`}
function measList(){return MS.map(m=>{const A=S.meas.filter(x=>x[m[0]]);if(!A.length)return"";const dl=A[A.length-1][m[0]]-A[0][m[0]];return `<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><b>${m[1]} ${A[A.length-1][m[0]]} cm</b><span class="mut" style="flex:0;white-space:nowrap">${dl>0?"+":""}${dl.toFixed(1)} dall’inizio</span></div>${lc(A.slice(-20),m[0])}</div>`}).join("")}

/* Referti: i file stanno in IndexedDB (solo su questo dispositivo) */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("fit-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fput(id,b){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("f").objectStore("f").get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function fdel(id){const d=await idb();return new Promise(res=>{const t=d.transaction("f","readwrite");t.objectStore("f").delete(id);t.oncomplete=res;t.onerror=res})}
function imgBlob(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b||f),"image/jpeg",.85)};im.onerror=()=>res(f);im.src=r.result};r.onerror=()=>res(f);r.readAsDataURL(f)})}
const DL={imp:"Impegnativa",res:"Risultato esame",vis:"Referto visita"};
const PRI={U:"Urgente (entro 72 ore)",B:"Breve (entro 10 giorni)",D:"Differibile (30–60 giorni)",P:"Programmata (entro 120 giorni)"};
/* Valori degli esami: {n:nome, v:valore come scritto, u:unità, lo/hi:intervallo del laboratorio o null} */
const num=s=>{if(s==null||s==="")return null;const x=parseFloat(String(s).replace(",",".").replace(/^[<>≤≥=\s]+/,""));return isFinite(x)?x:null};
const nk=s=>String(s).toLowerCase().replace(/\s+/g," ").trim();
function vst(o){const x=num(o.v);if(x==null)return 0;if(o.lo!=null&&x<o.lo)return -1;if(o.hi!=null&&x>o.hi)return 1;return 0}
const rgTxt=o=>o.lo!=null&&o.hi!=null?`${o.lo}–${o.hi}`:o.hi!=null?`fino a ${o.hi}`:o.lo!=null?`da ${o.lo}`:"non indicato";
function params(){const M={};S.docs.forEach(d=>(d.vals||[]).forEach(o=>{const k=nk(o.n);(M[k]=M[k]||{n:o.n,h:[]}).h.push({...o,d:d.d})}));
 return Object.values(M).map(p=>{p.h.sort((a,b)=>a.d<b.d?-1:1);p.l=p.h[p.h.length-1];p.s=vst(p.l);return p})}
function alertsN(){const soon=ld(new Date(Date.now()+7*864e5));return params().filter(p=>p.s).length+S.docs.filter(x=>x.t=="imp"&&!x.done&&x.x&&x.x<=soon).length}
function rbar(o){const x=num(o.v),lo=o.lo,hi=o.hi;if(x==null||(lo==null&&hi==null))return"";
 const sp=lo!=null&&hi!=null?(hi-lo)||1:Math.abs(hi??lo)||1;let a=(lo??Math.min(0,hi-sp))-sp*.4,b=(hi??lo+sp)+sp*.4;a=Math.min(a,x-sp*.1);b=Math.max(b,x+sp*.1);
 const P=z=>((z-a)/(b-a)*100).toFixed(1);const L=lo!=null?P(lo):0,R=hi!=null?P(hi):100,s=vst(o);
 return `<div class="rb" role="img" aria-label="${s?(s>0?"Sopra":"Sotto")+" il riferimento":"Nella norma"}"><i style="left:${L}%;width:${R-L}%"></i><b style="left:${P(x)}%;background:${s?"var(--bad)":"var(--ok)"}"></b></div>`}
function spark(H,o){if(H.length<2)return"";const X=H.map(h=>h.x),lim=[o.lo,o.hi].filter(z=>z!=null);let mn=Math.min(...X,...lim),mx=Math.max(...X,...lim);const pd=(mx-mn)*.15||1;mn-=pd;mx+=pd;
 const w=320,h=70,Y=z=>h-6-(z-mn)/(mx-mn)*(h-12),pts=H.map((p,i)=>[10+i*(w-20)/(H.length-1),Y(p.x)]);
 const band=o.lo!=null||o.hi!=null?`<rect x="0" width="${w}" y="${Y(o.hi??mx)}" height="${Math.max(0,Y(o.lo??mn)-Y(o.hi??mx))}" fill="var(--ok)" opacity=".13"/>`:"";
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Andamento nel tempo">${band}<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${H[i].s?"var(--bad)":"var(--ac)"}"/>`).join("")}</svg>`}
function pCard(p,i){const l=p.l,pr=p.h.length>1?p.h[p.h.length-2]:null,x=num(l.v),px=pr?num(pr.v):null,u=esc(l.u||"");
 const st=p.s?`<span class="pill" style="color:var(--bad)">${p.s>0?"Alto":"Basso"}</span>`:x!=null&&(l.lo!=null||l.hi!=null)?`<span class="pill" style="color:var(--ok)">Nella norma</span>`:"";
 const tr=px!=null&&x!=null?` · ${x>px?"↑":x<px?"↓":"="} prima ${esc(pr.v)} (${fd(pr.d)})`:"";
 const H=p.h.map(h=>({x:num(h.v),s:vst(h)})).filter(h=>h.x!=null).slice(-12);
 return `<div class="card${p.s?" warn":""}" id="p${i}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3 style="flex:1">${esc(p.n)}</h3>${st}</div>
 <div style="margin-top:2px"><span class="big" style="font-size:26px${p.s?";color:var(--bad)":""}">${esc(l.v)}</span> <span class="mut">${u} · ${fd(l.d)}</span></div>
 ${rbar(l)}<div class="mut">Riferimento ${rgTxt(l)} ${u}${tr}</div>${spark(H,l)}</div>`}
function vVals(){const P=params().sort((a,b)=>Math.abs(b.s)-Math.abs(a.s)||a.n.localeCompare(b.n,"it"));
 if(!P.length)return'<p class="mut">Nessun valore ancora. Aggiungi un risultato con i valori (anche incollando i dati letti da Claude) e qui li vedrai tutti, con l’andamento nel tempo.</p>';
 const bad=P.filter(p=>p.s).length,ok=P.filter(p=>!p.s&&num(p.l.v)!=null&&(p.l.lo!=null||p.l.hi!=null)).length,nr=P.length-bad-ok,last=P.reduce((m,p)=>p.l.d>m?p.l.d:m,"");
 const row=(p,i)=>{const s=p.s,has=num(p.l.v)!=null&&(p.l.lo!=null||p.l.hi!=null);return `<a class="sr" href="#p${i}" onclick="event.preventDefault();$('p${i}').scrollIntoView({behavior:'smooth',block:'center'})"><span class="si" style="background:${s?"var(--bad)":has?"var(--ok)":"var(--line)"}" aria-hidden="true">${s>0?"▲":s<0?"▼":has?"✓":"–"}</span><span class="sn">${esc(p.n)}<small>${fd(p.l.d)}</small></span><span class="sv"${s?' style="color:var(--bad)"':""}>${esc(p.l.v)} <small>${esc(p.l.u||"")}</small><small>${rgTxt(p.l)}</small></span></a>`};
 const grp=(t,f)=>{const R=P.map((p,i)=>[p,i]).filter(([p])=>f(p));return R.length?`<div class="sh">${t} · ${R.length}</div>${R.map(([p,i])=>row(p,i)).join("")}`:""};
 return `<div class="row" style="margin-bottom:12px;gap:6px"><div class="tile"><b style="color:var(--bad)">${bad}</b>fuori norma</div><div class="tile"><b style="color:var(--ok)">${ok}</b>nella norma</div><div class="tile"><b>${P.length}</b>esami seguiti</div></div>
 <div class="card${bad?" warn":""}"><h2 style="margin:0">Riepilogo</h2><div class="mut" style="margin:2px 0 6px">Ultimo valore di ogni esame${last?`, aggiornato al ${fd(last)}`:""}. Tocca una riga per il dettaglio.</div>
 ${grp("Fuori norma",p=>p.s)}${grp("Nella norma",p=>!p.s&&num(p.l.v)!=null&&(p.l.lo!=null||p.l.hi!=null))}${grp("Senza intervallo di riferimento",p=>!p.s&&!(num(p.l.v)!=null&&(p.l.lo!=null||p.l.hi!=null)))}
 <div class="mut" style="margin-top:10px">Confronto con l’intervallo del laboratorio: non sostituisce il parere del medico.</div></div>
 <h2 style="margin:18px 0 10px">Dettaglio e andamento</h2>${P.map(pCard).join("")}`}
function alertCard(){const P=params().filter(p=>p.s),t=day(),soon=ld(new Date(Date.now()+7*864e5)),I=S.docs.filter(x=>x.t=="imp"&&!x.done&&x.x&&x.x<=soon);if(!P.length&&!I.length)return"";
 return `<div class="card warn"><h2>⚠️ Da tenere d’occhio</h2>${P.map(p=>`<div class="item"><div><b>${esc(p.n)}</b> ${esc(p.l.v)} ${esc(p.l.u||"")}<div class="mut">${p.s>0?"Sopra":"Sotto"} il riferimento (${rgTxt(p.l)}) · ${fd(p.l.d)}</div></div><span class="pill" style="color:var(--bad);flex:0 0 auto">${p.s>0?"Alto":"Basso"}</span></div>`).join("")}${I.map(x=>`<div class="item"><div><b>${esc(x.n)}</b><div class="mut">Impegnativa ${x.x<t?"scaduta il":"in scadenza il"} ${fd(x.x)}</div></div></div>`).join("")}

function valRows(x){return (x.vals||[]).map((o,i)=>{const s=vst(o);return `<div class="item"><div style="min-width:0"><b>${esc(o.n)}</b><div class="mut">Rif. ${rgTxt(o)} ${esc(o.u||"")}</div></div><div style="text-align:right;flex:0 0 auto;${s?"color:var(--bad);font-weight:600":""}">${s?(s>0?"▲ ":"▼ "):""}${esc(o.v)} ${esc(o.u||"")}</div><button class="x" aria-label="Elimina ${esc(o.n)}" onclick="delVal('${x.id}',${i})">✕</button></div>`}).join("")}

 const f=x.f||{},bad=(x.vals||[]).filter(vst).length,kv=(k,val)=>val?`<div class="kv"><span>${k}</span><span>${esc(val)}</span></div>`:"";
 const info=x.t=="imp"?kv("Medico",f.med)+kv("NRE",f.nre)+kv("Priorità",PRI[f.pri]||f.pri)+kv("Esenzione",f.ese)+kv("Quesito",f.que)+((f.pres||[]).length?`<div style="margin-top:6px"><label>Prestazioni</label>${f.pres.map(p=>`<div class="item" style="padding:5px 0"><span>${esc(p.n)}${p.q>1?` × ${p.q}`:""}</span><span class="mut" style="flex:0 0 auto">${esc(p.c||"")}</span></div>`).join("")}</div>`:""):kv("Laboratorio",x.lab);
 const vals=x.t=="imp"?"":`${bad?`<div class="alert">⚠️ ${bad} ${bad==1?"valore fuori":"valori fuori"} dal riferimento</div>`:""}${(x.vals||[]).length?`<div style="margin-top:8px">${valRows(x)}</div>`:""}
 <details style="margin-top:8px"><summary class="mut">Aggiungi un valore a mano</summary><div class="row" style="margin-top:6px"><input id="vn${x.id}" placeholder="Esame (es. Glicemia)" style="flex:2 1 140px"><input id="vv${x.id}" placeholder="Valore" inputmode="decimal"><input id="vu${x.id}" placeholder="Unità"></div>

const KW=(t,re)=>(t.match(re)||[]).length;
function classify(t,fromFile){const s=t.toLowerCase(),vals=labVals(t),im=impData(t),sc={
  res:vals.length*2+KW(s,/referto|laboratorio|valori di riferimento|esito|analisi|emocromo/g),
  imp:KW(s,/impegnativa|ricetta|prescrizione|quesito|priorit|esenzion|servizio sanitario|\bssn\b|prescritt/g)*2+(im.nre?5:0)+im.pres.length,
  vis:KW(s,/visita|diagnosi|conclusion|esame obiettivo|anamnesi|ecografi|radiografi|risonanza|\btac\b|elettrocardiogramma|terapia/g)*1.5,
  food:fromFile?0:KW(s,/\b(mangiat\w*|pranzo|cena|colazione|spuntino|merenda|kcal|calorie)\b/g)*2+foods(t).filter(f=>f.k).length*1.5,
  gym:fromFile?0:KW(s,/allenament|serie|ripetizion|\d+\s*x\s*\d+/g)*2+gymRows(t).filter(r=>r.n!="Esercizio").length*2,
  water:fromFile?0:KW(s,/\b(bevut\w*|acqua|bicchier\w*|borracc\w*|bottigliett\w*)\b/g)*2,
  weight:fromFile?0:(/\b(peso|pesavo|peso di|bilancia|pesato)\b/.test(s)&&/\d{2,3}([.,]\d)?/.test(s)?5:0),
  ev:fromFile?0:KW(s,/appuntament|dentista|riunione|ricordami|ricorda|\balle\s+\d|\bdomani\b|\bdopodomani\b|lunedì|martedì|mercoledì|giovedì|venerdì|sabato|domenica/g)*1.5};
 const best=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];return sc[best]>0?best:(fromFile?"vis":"note")}
/* --- interfaccia --- */
const IBT={res:"🩺 Risultato esami",imp:"📄 Impegnativa",vis:"🩺 Referto visita",food:"🍽️ Pasto",gym:"🏋️ Allenamento",water:"💧 Acqua",weight:"⚖️ Peso",ev:"📅 Impegno in agenda",note:"📝 Nota (referto visita)"};
let IB={files:[],text:"",type:"",data:null,rec:null};
function ibOpen(){IB={files:[],text:"",type:"",data:null,rec:null};$("inbox").style.display="block";ibPaint();setTimeout(()=>$("ibt")&&$("ibt").focus(),50)}
function ibClose(){try{IB.rec&&IB.rec.stop()}catch(e){}$("inbox").style.display="none";$("inbox").innerHTML=""}
const ibSt=m=>{const o=$("ibst");if(o)o.textContent=m};
function ibPaint(){const B=$("inbox");B.innerHTML=`<main><div class="row" style="flex-wrap:nowrap;margin-bottom:12px"><h1 style="flex:1">Casella</h1><button class="g" style="flex:0" onclick="ibClose()">Chiudi</button></div>
 <div class="card"><p class="mut" style="margin-top:0">Scrivi, detta o allega referti, impegnative (PDF o foto). Capisco cos'è e ti propongo dove salvarlo: tu controlli e confermi.</p>
 <textarea id="ibt" rows="4" placeholder="Es. «a pranzo 100 g di pasta e 150 g di pollo», «panca 3x8 a 70 kg», «dentista martedì alle 15», «ho bevuto mezzo litro»">${esc(IB.text)}</textarea>
 <div class="row" style="margin-top:8px"><button class="g" id="ibmic" onclick="ibMic()">🎤 Detta</button><label class="g ibf">📎 PDF o foto<input type="file" accept="application/pdf,image/*" multiple onchange="ibFiles(this)" hidden></label></div>
 ${IB.files.length?`<div class="mut" style="margin-top:6px">${IB.files.map(f=>"📎 "+esc(f.name)).join("<br>")}</div>`:""}
 <button style="width:100%;margin-top:10px" onclick="ibRun()">Analizza</button><p id="ibst" class="mut" role="status" style="margin:8px 0 0"></p></div>
 <div id="ibres">${IB.type?ibForm():""}</div><p class="mut">La lettura avviene sul tuo telefono, senza servizi di intelligenza artificiale; quello che salvi si sincronizza nel tuo spazio come il resto dei dati. Per la prima foto o il primo PDF scansionato l'app scarica il lettore (qualche MB).</p></main>`}
function ibMic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("La dettatura qui non è disponibile: tocca il campo di testo e usa il microfono della tastiera dell'iPhone.");$("ibt").focus();return}
 if(IB.rec){IB.rec.stop();return}const r=new R();r.lang="it-IT";r.interimResults=true;r.continuous=true;const base=$("ibt").value?$("ibt").value+" ":"";
 r.onresult=e=>{let t="";for(const x of e.results)t+=x[0].transcript;$("ibt").value=base+t};r.onend=()=>{IB.rec=null;const b=$("ibmic");if(b)b.textContent="🎤 Detta"};
 r.onerror=e=>{if(e.error=="not-allowed")alert("Consenti l'uso del microfono, oppure usa il microfono della tastiera.")};r.start();IB.rec=r;$("ibmic").textContent="⏹ Stop"}
function ibFiles(el){IB.text=$("ibt").value;const aud=[...el.files].filter(f=>f.type.startsWith("audio/"));IB.files=IB.files.concat([...el.files].filter(f=>!f.type.startsWith("audio/")));ibPaint();if(aud.length)ibSt("I file audio non posso trascriverli gratis: usa 🎤 Detta.")}
async function ibRun(){IB.text=$("ibt").value.trim();if(!IB.text&&!IB.files.length){ibSt("Scrivi qualcosa o allega un file.");return}
 let t=IB.text;try{for(const f of IB.files){if(f.type=="application/pdf")t+="\n"+await pdfText(f);else if(f.type.startsWith("image/"))t+="\n"+await ocr(await imgBlob(f))}}
 catch(e){ibSt("Non riesco a leggere il file: "+(e.message||e)+". Puoi comunque scrivere a mano cosa contiene.");return}
 IB.full=t;IB.type=classify(t,IB.files.length>0);ibBuild();ibSt("");$("ibres").innerHTML=ibForm();$("ibres").scrollIntoView({behavior:"smooth"})}
function ibBuild(){const t=IB.full,ty=IB.type,dd=docDate(t)||day();
 IB.data=ty=="res"?{n:/glucos|emocromo|colesterol|emoglobin|creatinin|trigliceri/i.test(t)?"Esami del sangue":"Risultato esami",d:dd,vals:labVals(t)}
 :ty=="imp"?{n:"Impegnativa",d:dd,x:"",...impData(t)}
 :ty=="vis"||ty=="note"?{n:((t.match(/(visita|ecografia|radiografia|risonanza|tac|elettrocardiogramma|ecg)[^\n]{0,40}/i)||[])[0]||(IB.files.length?"Referto":"Nota")).trim().replace(/^./,x=>x.toUpperCase()),d:dd,note:t.trim().slice(0,1500)}
 :ty=="food"?{rows:foods(t)}:ty=="gym"?{rows:gymRows(t)}:ty=="water"?{ml:waterMl(t)}
 :ty=="weight"?{kg:nv((t.match(/(\d{2,3}(?:[.,]\d)?)/)||[])[1])||""}:evParse(t)}
function ibType(v){IB.type=v;ibBuild();$("ibres").innerHTML=ibForm()}
const fi=(id,val,ph,w,type)=>`<input id="${id}" value="${esc(val??"")}" placeholder="${ph||""}" ${type?`type="${type}"`:""} style="${w?`flex:${w}`:""}" aria-label="${ph||id}">`;
function ibForm(){const D=IB.data,ty=IB.type;let h="";
 if(ty=="res")h=`${fi("ib_n",D.n,"Titolo")}<div class="row" style="margin-top:6px"><div><label>Data</label>${fi("ib_d",D.d,"","","date")}</div></div>
  <label style="margin-top:8px">Valori trovati (${D.vals.length}) · controlla e correggi</label>${D.vals.map((o,i)=>`<div class="row ibv">${fi("v_n"+i,o.n,"Esame",3)}${fi("v_v"+i,o.v,"Valore",1)}${fi("v_u"+i,o.u,"Unità",1)}${fi("v_l"+i,o.lo,"Min",1)}${fi("v_h"+i,o.hi,"Max",1)}<button class="x" onclick="ibRead();IB.data.vals.splice(${i},1);$('ibres').innerHTML=ibForm()" aria-label="Togli">✕</button></div>`).join("")||'<p class="mut">Nessun valore riconosciuto: salvo il file e puoi aggiungerli a mano.</p>'}`;
 else if(ty=="imp")h=`${fi("ib_n",D.n,"Titolo")}<div class="row" style="margin-top:6px"><div><label>Data</label>${fi("ib_d",D.d,"","","date")}</div><div><label>Scadenza</label>${fi("ib_x",D.x,"","","date")}</div></div>
  <div class="row" style="margin-top:6px">${fi("ib_nre",D.nre,"NRE")}${fi("ib_pri",D.pri,"Priorità (U/B/D/P)")}</div><div class="row" style="margin-top:6px">${fi("ib_med",D.med,"Medico")}${fi("ib_ese",D.ese,"Esenzione")}</div>${fi("ib_que",D.que,"Quesito diagnostico")}
  <label style="margin-top:8px">Prestazioni (${D.pres.length})</label>${D.pres.map((p,i)=>`<div class="row ibv">${fi("p_c"+i,p.c,"Codice",1)}${fi("p_n"+i,p.n,"Prestazione",3)}</div>`).join("")||'<p class="mut">Nessuna prestazione riconosciuta.</p>'}`;
 else if(ty=="vis"||ty=="note")h=`${fi("ib_n",D.n,"Titolo")}<div class="row" style="margin-top:6px"><div><label>Data</label>${fi("ib_d",D.d,"","","date")}</div></div><label style="margin-top:8px">Testo</label><textarea id="ib_note" rows="5">${esc(D.note)}</textarea>`;
 else if(ty=="food")h=`<label>Alimenti · kcal stimate per le quantità indicate</label>${D.rows.map((o,i)=>`<div class="row ibv">${fi("f_n"+i,o.n,"Alimento",3)}${fi("f_g"+i,o.g,"g",1)}${fi("f_k"+i,o.k||"","kcal",1)}</div>`).join("")||'<p class="mut">Non ho riconosciuto gli alimenti: scrivili come «100 g di pasta».</p>'}<div class="mut">Totale circa ${D.rows.reduce((s,o)=>s+o.k,0)} kcal. Gli alimenti senza kcal vanno completati.</div>`;
 else if(ty=="gym")h=`<label>Serie di oggi</label>${D.rows.map((o,i)=>`<div class="row ibv">${fi("g_n"+i,o.n,"Esercizio",3)}${fi("g_s"+i,o.s,"Serie",1)}${fi("g_r"+i,o.r||"","Rip.",1)}${fi("g_k"+i,o.kg||"","kg",1)}</div>`).join("")}`;
 else if(ty=="water")h=`<label>Acqua bevuta (ml)</label>${fi("ib_ml",D.ml,"ml","","number")}`;
 else if(ty=="weight")h=`<label>Peso di oggi (kg)</label>${fi("ib_kg",D.kg,"kg","","number")}`;
 else if(ty=="ev")h=`${fi("ib_n",D.n,"Titolo")}<div class="row" style="margin-top:6px"><div><label>Giorno</label>${fi("ib_d",D.d,"","","date")}</div><div><label>Inizio</label>${fi("ib_s",D.s,"","","time")}</div><div><label>Fine</label>${fi("ib_e",D.e,"","","time")}</div></div>`;
 return `<div class="card"><label for="ibty">Ho capito che è</label><select id="ibty" onchange="ibType(this.value)">${Object.keys(IBT).map(k=>`<option value="${k}" ${k==ty?"selected":""}>${IBT[k]}</option>`).join("")}</select>
 <div style="margin-top:10px">${h}</div><button style="width:100%;margin-top:12px" onclick="ibSave()">Salva</button>
 <details style="margin-top:8px"><summary class="mut">Testo letto</summary><pre class="ibpre">${esc(IB.full||"")}</pre></details></div>`}
function ibRead(){const D=IB.data,g=id=>$(id)?$(id).value.trim():"";if(!D)return;
 if(D.vals)D.vals=D.vals.map((o,i)=>$("v_n"+i)?{n:g("v_n"+i),v:g("v_v"+i),u:g("v_u"+i),lo:num(g("v_l"+i)),hi:num(g("v_h"+i))}:o)}
async function ibSave(){const ty=IB.type,D=IB.data,g=id=>$(id)?$(id).value.trim():"";let where="";
 try{if(["res","imp","vis","note"].includes(ty)){ibRead();const files=await storeFiles(IB.files),o={t:ty=="note"?"vis":ty,n:g("ib_n")||D.n,d:g("ib_d")||day()};
   if(ty=="res"){o.vals=D.vals.filter(z=>z.n&&z.v);}
   if(ty=="imp"){o.x=g("ib_x");o.f={nre:g("ib_nre").replace(/\s/g,""),pri:g("ib_pri").toUpperCase().slice(0,1),med:g("ib_med"),ese:g("ib_ese"),que:g("ib_que"),pres:D.pres.map((p,i)=>({c:g("p_c"+i),n:g("p_n"+i),q:p.q})).filter(p=>p.n)}}
   if(ty=="vis"||ty=="note")o.note=g("ib_note");storeDocs([o],files);dtab=ty=="res"?((o.vals||[]).some(vst)?"val":"res"):ty=="imp"?"imp":"res";tab="doc";where="Referti"}
  else if(ty=="food"){D.rows.forEach((o,i)=>{const k=Math.round(num(g("f_k"+i))||0),gr=num(g("f_g"+i))||0,sc=o.k&&k?k/o.k:1;if(g("f_n"+i)&&k)S.food.push({id:uid(),d:day(),n:g("f_n"+i)+(gr?` (${gr} g)`:""),k,pr:Math.round(o.p*sc),c:Math.round(o.c*sc),f:Math.round(o.f*sc)})});tab="diet";where="Dieta"}
  else if(ty=="gym"){D.rows.forEach((o,i)=>{const nm=g("g_n"+i);if(!nm)return;let e=S.ex.find(x=>nk(x.name)==nk(nm));if(!e){e={id:uid(),name:nm,sets:[],days:[]};S.ex.push(e)}
    for(let k=0;k<Math.max(1,+g("g_s"+i)||1);k++)e.sets.push({id:uid(),d:day(),kg:num(g("g_k"+i))||0,r:+g("g_r"+i)||0,rest:0})});tab="gym";where="Palestra"}
  else if(ty=="water"){addW(Math.round(num(g("ib_ml"))||0));tab="oggi";where="Oggi"}
  else if(ty=="weight"){const kg=num(g("ib_kg"));if(!kg){alert("Scrivi il peso.");return}S.w.push({id:uid(),d:day(),kg});S.w.sort((a,b)=>a.d<b.d?-1:1);tab="prog";where="Progressi"}
  else if(ty=="ev"){if(!g("ib_d")){alert("Scegli il giorno.");return}S.ev.push({id:uid(),d:g("ib_d"),s:g("ib_s"),e:g("ib_e")||g("ib_s"),n:g("ib_n")||"Impegno"});agSel=g("ib_d");agm=agSel.slice(0,7);agv="mese";tab="ag";where="Agenda"}
  save();ibClose();render();window.scrollTo(0,0);toast("Salvato in "+where)}catch(e){alert("Non sono riuscito a salvare: "+(e.message||e))}}
function toast(m){const t=$("toast");t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2500)}

/* Navigazione */
const TABS=[["oggi","💧","Oggi"],["gym","🏋️","Palestra"],["diet","🍽️","Dieta"],["ag","📅","Agenda"],["prog","📈","Progressi"],["doc","🩺","Referti"]];
function render(){const y=window.scrollY;
 if(sb&&(!me||needPw)){$("nav").style.display="none";$("fab").style.display="none";$("app").innerHTML=!authReady?'<p class="mut" style="text-align:center;margin-top:30vh">Caricamento…</p>':me?vSetPw():vLogin();return}
 $("nav").style.display="";$("fab").style.display="";
 const na=alertsN();$("nav").innerHTML=TABS.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')" aria-label="${t[2]}${t[0]=="doc"&&na?`, ${na} avvisi`:""}"><span>${t[1]}</span>${t[2]}${t[0]=="doc"&&na?`<i class="dot">${na}</i>`:""}</button>`).join("");
 $("app").innerHTML={oggi:vOggi,gym:vGym,diet:vDiet,ag:vAg,prog:vProg,doc:vDoc}[tab]();paintCal();window.scrollTo(0,y)}
function go(t){tab=t;render();window.scrollTo(0,0)}
startSync();render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();syncNow()}});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
