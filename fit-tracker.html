/* Piano della nutrizionista: S.plan={d,files,text,days:{tutti|0..6:{pasto:[voci]}}}. Letto da foto/PDF sul dispositivo. */
const PASTI=[["colazione",/colazione/],["spuntino",/spuntino|met[aà]\s*mattin|mid-?morning/],["pranzo",/pranzo/],["merenda",/merenda|spuntino\s*(del\s*)?pomeri|met[aà]\s*pomeri/],["cena",/cena/],["dopo cena",/dopo\s*cena|serale/]];
function parsePlan(t){const days={};let dk="tutti",mk=null;
 t.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{const low=l.toLowerCase();
  const g=GG.findIndex(x=>new RegExp(`^(${x}|${x.slice(0,-1)}|${x.slice(0,3)})\\b`,"i").test(low))+1||((low.match(/^giorno\s*(\d)/)||[])[1]|0);
  if(g&&l.length<30){dk=String((g-1)%7);mk=null;return}
  const p=[3,5,0,1,2,4].find(i=>{const x=PASTI[i];return x[1].test(low)&&low.replace(x[1],"").replace(/[^a-z]/g,"").length<(i==1||i==3?14:8)||new RegExp(`^${x[0]}\\b`).test(low)})??-1;
  if(p>=0){mk=PASTI[p][0];const rest=l.replace(/^[^:–-]*[:–-]\s*/,"");(days[dk]=days[dk]||{})[mk]=(days[dk][mk]||[]);if(rest&&rest!=l)days[dk][mk].push(...rest.split(/\s*[;•]\s*/).filter(Boolean));return}
  if(mk){(days[dk]=days[dk]||{})[mk]=days[dk][mk]||[];days[dk][mk].push(l.replace(/^[-•*·o▪●]\s*/,""))}});return days}

  :`<p class="mut" style="margin-top:0">Carica la foto o il PDF della dieta: la leggo e ti mostro ogni giorno cosa mangiare a colazione, pranzo e cena.</p><label class="ibf" style="color:var(--acT);background:var(--ac);border:0"><i class="ti ti-file-upload"></i>Carica foto o PDF<input type="file" accept="application/pdf,image/*" multiple hidden onchange="planLoad(this)"></label><p id="plst" class="mut" role="status" style="margin:8px 0 0"></p>`}</div>`;

 <div class="row" style="margin-top:8px">${(P.files||[]).map(f=>`<button class="g" onclick="viewDoc('${f.id}')"><i class="ti ti-file"></i>Originale</button>`).slice(0,1).join("")}<button class="g" onclick="planEdit=1;render()">Correggi</button><label class="g ibf">Sostituisci<input type="file" accept="application/pdf,image/*" multiple hidden onchange="planLoad(this)"></label></div></div>`}
async function planLoad(el){const fs=[...el.files];if(!fs.length)return;const o=$("plst"),st=m=>{if(o)o.textContent=m;else toast(m)};IB={files:[],text:""};
 try{let t="";for(const f of fs){st("Leggo "+f.name+"…");t+="\n"+(f.type=="application/pdf"?await pdfText(f):await ocr(await imgBlob(f)))}
  const files=await storeFiles(fs);S.plan={d:day(),files,text:t.trim(),days:parsePlan(t)};planEdit=Object.keys(S.plan.days).length?0:1;save();render();toast(planEdit?"Non ho trovato i pasti: controlla il testo":"Dieta caricata")}

  scanCtl=await r.decodeFromConstraints({video:{facingMode:"environment"}},$("scv"),res=>{if(res&&scanCtl){stopCam();if(navigator.vibrate)navigator.vibrate(60);scanGot(res.getText())}});

  if(j.status!=1||!j.product){prodSheet({bc,p:null});return}const P=j.product,N=P.nutriments||{},k=N["energy-kcal_100g"]??(N.energy_100g!=null?N.energy_100g/4.184:null),r1=x=>x==null?"":Math.round(x*10)/10;
  prodSheet({bc,p:{n:((P.product_name_it||P.product_name||"Prodotto").trim()+(P.brands?" · "+P.brands.split(",")[0].trim():"")).slice(0,80),k:k==null?"":Math.round(k),p:r1(N.proteins_100g),c:r1(N.carbohydrates_100g),f:r1(N.fat_100g),sv:+P.serving_quantity||""},off:1})}

 const T=[["allenamenti",m.gym,"#FF5A2C"],["kg sollevati",it(m.vol),"#fff"],["kcal medie",m.kcal?it(m.kcal):"–","#34D06C"],["acqua media",m.water?L1(m.water*1000)+" L":"–","#3D8BFF"],["anelli chiusi",m.rings+" giorni","#fff"],["serie",m.sets,"#fff"]];
 T.forEach((t,i)=>{const cx=80+(i%2)*480,cy=470+Math.floor(i/2)*270;x.fillStyle="#1C1C1E";x.beginPath();x.roundRect(cx,cy-120,440,230,36);x.fill();x.fillStyle=t[2];x.font=`700 88px ${F}`;x.fillText(String(t[1]),cx+36,cy+10);x.fillStyle="#8E8E93";x.font=`500 38px ${F}`;x.fillText(t[0],cx+36,cy+70)});
 const blob=await new Promise(r=>c.toBlob(r,"image/png")),file=new File([blob],`fit-tracker-${ym}.png`,{type:"image/png"});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Il mio mese"})}catch(e){}}
 else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}}
