<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il mio allenamento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fit Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141C" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#16202E;--mut:#6B7788;--line:#DCE1E8;--ac:#2848E8;--acT:#fff;--wat:#0E9AA7;--kc:#E8742A;--ok:#1E9E5A;--bad:#D6453D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141C;--card:#19212D;--ink:#EAEFF6;--mut:#92A0B3;--line:#2A3444;--ac:#6F8BFF;--acT:#0F141C;--wat:#38C4D2;--kc:#FF9A57;--ok:#4CC885;--bad:#FF7A72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141C;--card:#19212D;--ink:#EAEFF6;--mut:#92A0B3;--line:#2A3444;--ac:#6F8BFF;--acT:#0F141C;--wat:#38C4D2;--kc:#FF9A57;--ok:#4CC885;--bad:#FF7A72;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Inter,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700;margin-bottom:10px}
.sub{color:var(--mut);margin:2px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:70px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
button{font:600 14px Inter,sans-serif;border:0;border-radius:9px;padding:10px 14px;background:var(--ac);color:var(--acT);cursor:pointer}
button.g{background:transparent;color:var(--mut);border:1px solid var(--line)}
button.x{background:none;color:var(--bad);padding:4px 8px;flex:0}
.big{font:800 34px Archivo,sans-serif;letter-spacing:-.02em}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:6px}
.mut{color:var(--mut);font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mut);padding:8px 4px;font-size:12px}
nav button.on{color:var(--ac)}
nav span{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
#timer{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;z-index:20;font-weight:600}
#timer button{padding:4px 10px;background:var(--bg);color:var(--ink)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--bg);font-size:12px;color:var(--mut)}
nav button{min-width:0}
#viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.card.warn{border-color:var(--bad);border-left:4px solid var(--bad)}
.alert{margin-top:8px;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-weight:600;font-size:14px}
.kv{display:flex;gap:10px;justify-content:space-between;padding:3px 0;font-size:14px}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right}
.rb{position:relative;height:8px;background:var(--line);border-radius:5px;margin:10px 7px 6px}
.rb i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 40%,transparent);border-radius:5px}
.rb b{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--card)}
.dot{font-style:normal;display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
nav button{position:relative}nav .dot{position:absolute;top:2px;left:calc(50% + 6px)}
summary{cursor:pointer}
.row>.pill{flex:0 0 auto}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.tile b{display:block;font:800 26px Archivo,sans-serif;color:var(--ink)}
.sh{font:700 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:12px 0 2px}
.sr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.sh+.sr{border-top:0}
.si{flex:0 0 22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:grid;place-items:center}
.sn{flex:1;min-width:0;font-weight:600}.sv{text-align:right;font-weight:600;white-space:nowrap}
.sn small,.sv small{display:block;font-weight:400;font-size:12px;color:var(--mut)}.sv small:first-child{display:inline}
#viewer img,#viewer iframe{flex:1;min-height:0;width:100%;object-fit:contain;border:0;background:#fff;border-radius:8px}
</style>
</head>
<body>
<div id="timer"><span id="tt"></span><button onclick="stopT()">Chiudi</button></div>
<div id="viewer"></div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const K="fit-tracker-v1";let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{p:{sex:"m",age:30,h:175,act:1.45,goal:0},w:[],ex:[],food:[],water:{},steps:{},runs:[]};
S.meas=S.meas||[];S.ev=S.ev||[];S.docs=S.docs||[];let dtab="imp";let gd=(new Date().getDay()+6)%7;
let tab="oggi",tI=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("Memoria piena: elimina qualche foto.")}};
const $=id=>document.getElementById(id);
const v=id=>$(id)?$(id).value.trim():"";
const n=id=>parseFloat(v(id).replace(",","."))||0;
const day=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>new Date(d+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const lastW=()=>S.w.length?S.w[S.w.length-1].kg:0;
function bar(val,max,col){return `<div class="bar"><i style="width:${Math.min(100,max?val/max*100:0)}%;background:${col}"></i></div>`}

/* Calcoli */
function target(){const p=S.p,kg=lastW()||70;
 const bmr=10*kg+6.25*p.h-5*p.age+(p.sex=="m"?5:-161);
 const k=Math.round(bmr*p.act+Number(p.goal));
 const pr=Math.round(kg*1.8),f=Math.round(k*.27/9),c=Math.max(0,Math.round((k-pr*4-f*9)/4));
 return {k,pr,f,c}}
function waterTarget(){const kg=lastW()||70;const t=day();
 const act=S.ex.some(e=>e.sets.some(s=>s.d==t));
 return Math.round(kg*35+(act?500:0))}

const DN=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const MS=[["vita","Vita"],["fianchi","Fianchi"],["petto","Petto"],["braccio","Braccio"],["coscia","Coscia"]];
const mi=t=>{const a=t.split(":");return +a[0]*60+ +a[1]};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const wd=d=>(new Date(d+"T12:00").getDay()+6)%7;
const ld=x=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const evOn=d=>S.ev.filter(x=>x.d==d).sort((a,b)=>a.s<b.s?-1:1);
const exOn=d=>S.ex.filter(e=>(e.days||[]).includes(wd(d)));
function freeSlot(d){const E=evOn(d).filter(x=>x.s&&x.e).map(x=>[mi(x.s),mi(x.e)]);let cur=360;const gaps=[];
 E.concat([[1320,1320]]).forEach(b=>{if(b[0]-cur>=75)gaps.push([cur,b[0]]);cur=Math.max(cur,b[1])});
 const ev=x=>x[1]-Math.max(x[0],1020)>=75;const g=gaps.find(ev)||gaps.sort((a,b)=>b[1]-b[0]-(a[1]-a[0]))[0];if(!g)return null;
 const s=ev(g)?Math.max(g[0],1020):g[0];return hm(s)+"–"+hm(Math.min(g[1],s+90))}
function planCard(){const t=day(),X=exOn(t),E=evOn(t),sl=freeSlot(t);
 return `<div class="card"><h2>Allenamento di oggi</h2>${X.length?X.map(e=>`<div class="item"><span>${esc(e.name)}</span><span class="mut">${e.sets.filter(s=>s.d==t).length} serie</span></div>`).join(""):'<p class="mut">Nessun esercizio in programma oggi. Assegna i giorni nella scheda Palestra.</p>'}
 ${E.length?`<div class="mut" style="margin-top:8px">Impegni: ${E.map(x=>(x.s?x.s+"–"+x.e+" ":"")+esc(x.n)).join(", ")}</div>`:""}
 <div class="pill" style="margin-top:8px">${sl?"Fascia consigliata: "+sl:"Oggi non ci sono fasce libere: riposo"}</div></div>`}
function togD(id,i){const e=S.ex.find(e=>e.id==id);e.days=e.days||[];const k=e.days.indexOf(i);k<0?e.days.push(i):e.days.splice(k,1);save();render()}
function parseICS(t){t=t.replace(/\r?\n[ \t]/g,"");const out=[];
 const p=s=>{const m=s.match(/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d))?/);if(!m)return null;if(!m[4])return{d:m[1]+"-"+m[2]+"-"+m[3],t:""};if(/Z\s*$/.test(s)){const x=new Date(Date.UTC(m[1],m[2]-1,m[3],m[4],m[5]));return{d:ld(x),t:x.toTimeString().slice(0,5)}}return{d:m[1]+"-"+m[2]+"-"+m[3],t:m[4]+":"+m[5]}};
 t.split("BEGIN:VEVENT").slice(1).forEach(b=>{const g=k=>{const m=b.match(new RegExp("(?:^|\\n)"+k+"[^:\\n]*:([^\\r\\n]*)"));return m?m[1].trim():""};
 const a=p(g("DTSTART")),e=p(g("DTEND"));if(!a)return;out.push({id:uid(),d:a.d,s:a.t,e:a.t?(e&&e.d==a.d?e.t:"23:59"):"",n:g("SUMMARY")||"Evento",src:1})});return out}

/* Agenda */
function vAg(){const b=Date.now(),days=[...Array(7)].map((_,i)=>ld(new Date(b+i*864e5)));
 return `<h1>Agenda</h1><p class="sub">Turni, impegni e allenamenti dei prossimi 7 giorni.</p>
 <div class="card"><h2>Aggiungi impegno</h2><input id="en" placeholder="Titolo (es. Dentista)"><div class="row" style="margin-top:8px"><div><label>Giorno</label><input id="ed" type="date" value="${day()}"></div><div><label>Inizio</label><input id="es" type="time"></div><div><label>Fine</label><input id="ee" type="time"></div></div><button style="width:100%;margin-top:8px" onclick="addEv()">Aggiungi</button></div>
 <div class="card"><h2>Importa turni</h2><p class="mut" style="margin-top:0">Esporta i turni (o il calendario) in un file .ics e sceglilo qui. Un nuovo import sostituisce il precedente.</p><input id="ei" type="file" accept=".ics,text/calendar" onchange="impICS(this)"></div>
 ${days.map(d=>{const E=evOn(d),X=exOn(d),sl=freeSlot(d);return `<div class="card"><h3>${DN[wd(d)]} ${fd(d)}</h3>${E.map(x=>`<div class="item"><span>${x.s?x.s+"–"+x.e:"Tutto il giorno"} · ${esc(x.n)}</span>${x.src?"":`<button class="x" onclick="delEv('${x.id}')">✕</button>`}</div>`).join("")}${X.length?`<div class="item"><span>🏋️ ${X.map(e=>esc(e.name)).join(", ")}</span><span class="pill">${sl||"nessuna fascia"}</span></div>`:""}${!E.length&&!X.length?'<p class="mut" style="margin:6px 0 0">Giorno libero.</p>':""}</div>`}).join("")}`}
function addEv(){const nm=v("en"),d=v("ed"),s=v("es"),e=v("ee");if(!nm||!d)return;S.ev.push({id:uid(),d,s,e:e||s,n:nm});save();render()}
function delEv(id){S.ev=S.ev.filter(x=>x.id!=id);save();render()}
function impICS(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const L=parseICS(r.result);S.ev=S.ev.filter(x=>!x.src).concat(L);save();alert(L.length+" eventi importati.");render()};r.readAsText(f)}

/* Oggi */
function vOggi(){const t=day(),w=S.water[t]||0,wt=waterTarget(),tg=target();
 const eaten=S.food.filter(f=>f.d==t).reduce((a,f)=>a+f.k,0);
 return `<h1>Oggi</h1><p class="sub">${new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}</p>
 ${alertCard()}${planCard()}<div class="card"><h2>Acqua</h2><div class="big" style="color:var(--wat)">${(w/1000).toFixed(2)} L</div>
 <div class="mut">Obiettivo di oggi: ${(wt/1000).toFixed(1)} L${S.ex.some(e=>e.sets.some(s=>s.d==t))?" (include +0,5 L per l’allenamento)":" (35 ml per kg di peso)"}</div>
 ${bar(w,wt,"var(--wat)")}
 <div class="row"><button onclick="addW(250)">+ 250 ml</button><button onclick="addW(500)">+ 500 ml</button><button class="g" onclick="addW(-250)">− 250</button></div></div>
 <div class="card"><h2>Calorie</h2><div class="big" style="color:var(--kc)">${eaten} <span class="mut" style="font:500 15px Inter">/ ${tg.k} kcal</span></div>${bar(eaten,tg.k,"var(--kc)")}
 <div class="mut">Restano ${Math.max(0,tg.k-eaten)} kcal. Registra i pasti nella scheda Dieta.</div></div>`}
function addW(m){const t=day();S.water[t]=Math.max(0,(S.water[t]||0)+m);save();render()}

/* Palestra */
function vGym(){const t=day();
 return `<h1>Palestra</h1><p class="sub">Scegli il giorno, aggiungi gli esercizi e registra ogni serie.</p>
 <div class="row" style="flex-wrap:nowrap;overflow-x:auto;margin-bottom:12px">${DN.concat(["Tutti"]).map((x,i)=>`<button class="${gd==i?"":"g"}" style="flex:0 0 auto;min-width:0" onclick="gd=${i};render()">${x}</button>`).join("")}</div>
 <div class="card"><div class="row"><input id="exn" placeholder="Nome esercizio (es. Panca piana)"><button onclick="addEx()" style="flex:0">Aggiungi</button></div></div>
 ${S.ex.filter(e=>gd==7||(e.days||[]).includes(gd)).map(e=>{const td=e.sets.filter(s=>s.d==t);
  const prev=e.sets.filter(s=>s.d<t);const pd=prev.length?prev[prev.length-1].d:null;
  const ps=pd?prev.filter(s=>s.d==pd):[];const last=e.sets[e.sets.length-1]||{};
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(e.name)}</h3><button class="x" onclick="delEx('${e.id}')">Elimina</button></div>
  <div class="row" style="gap:4px;margin:6px 0">${DN.map((x,i)=>`<button class="${(e.days||[]).includes(i)?"":"g"}" style="padding:4px 0;font-size:12px;min-width:0" onclick="togD('${e.id}',${i})">${x}</button>`).join("")}</div>
  ${ps.length?`<div class="mut">Ultima volta (${fd(pd)}): ${ps.map(s=>s.kg+"×"+s.r).join(", ")}</div>`:'<div class="mut">Prima volta: nessuno storico.</div>'}
  <div class="row" style="margin-top:8px"><div><label>Carico (kg)</label><input id="k${e.id}" type="number" step="0.5" inputmode="decimal" value="${last.kg||""}"></div><div><label>Ripetizioni</label><input id="r${e.id}" type="number" inputmode="numeric" value="${last.r||""}"></div><div><label>Riposo (s)</label><input id="s${e.id}" type="number" inputmode="numeric" value="${last.rest||90}"></div></div>
  <button style="width:100%;margin-top:8px" onclick="addSet('${e.id}')">Registra serie e avvia riposo</button>
  ${td.map((s,i)=>`<div class="item"><span>Serie ${i+1}: <b>${s.kg} kg × ${s.r}</b></span><span class="mut">riposo ${s.rest}s <button class="x" onclick="delSet('${e.id}','${s.id}')">✕</button></span></div>`).join("")}</div>`}).join("")||'<p class="mut">Nessun esercizio ancora. Inizia dal campo qui sopra.</p>'}`}
function addEx(){const x=v("exn");if(!x)return;S.ex.push({id:uid(),name:x,sets:[],days:gd<7?[gd]:[]});save();render()}
function delEx(id){if(confirm("Eliminare l’esercizio e il suo storico?")){S.ex=S.ex.filter(e=>e.id!=id);save();render()}}
function addSet(id){const kg=n("k"+id),r=n("r"+id),rest=n("s"+id);if(!r)return;
 S.ex.find(e=>e.id==id).sets.push({id:uid(),d:day(),kg,r,rest});save();render();if(rest>0)startT(rest)}
function delSet(id,sid){const e=S.ex.find(e=>e.id==id);e.sets=e.sets.filter(s=>s.id!=sid);save();render()}
function startT(sec){stopT();let end=Date.now()+sec*1e3;$("timer").style.display="flex";
 const tick=()=>{const l=Math.max(0,Math.round((end-Date.now())/1e3));$("tt").textContent=l?"Riposo: "+Math.floor(l/60)+":"+String(l%60).padStart(2,"0"):"Riposo finito, prossima serie!";
  if(!l){clearInterval(tI);try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}}};tick();tI=setInterval(tick,500)}
function stopT(){clearInterval(tI);$("timer").style.display="none"}

/* Dieta */
function vDiet(){const t=day(),tg=target(),L=S.food.filter(f=>f.d==t);
 const s=k=>L.reduce((a,f)=>a+f[k],0);
 const m=(lab,val,max,col)=>`<div><div class="row" style="justify-content:space-between"><span>${lab}</span><span class="mut" style="flex:0;white-space:nowrap">${Math.round(val)} / ${max} g</span></div>${bar(val,max,col)}</div>`;
 return `<h1>Dieta</h1><p class="sub">Obiettivo calcolato dai tuoi dati personali (scheda Progressi).</p>
 <div class="card"><div class="big" style="color:var(--kc)">${s("k")} <span class="mut" style="font:500 15px Inter">/ ${tg.k} kcal</span></div>${bar(s("k"),tg.k,"var(--kc)")}
 ${m("Proteine",s("pr"),tg.pr,"var(--ac)")}${m("Carboidrati",s("c"),tg.c,"var(--kc)")}${m("Grassi",s("f"),tg.f,"var(--wat)")}</div>
 <div class="card"><h2>Aggiungi alimento</h2><input id="fn" placeholder="Cosa hai mangiato"><div class="row" style="margin-top:8px"><div><label>Kcal</label><input id="fk" type="number" inputmode="numeric"></div><div><label>Prot. (g)</label><input id="fp" type="number" inputmode="decimal"></div><div><label>Carb. (g)</label><input id="fc" type="number" inputmode="decimal"></div><div><label>Grassi (g)</label><input id="ff" type="number" inputmode="decimal"></div></div>
 <p class="mut" style="margin:8px 0">Se lasci le kcal vuote le calcolo dai macro.</p><button style="width:100%" onclick="addFood()">Aggiungi</button></div>
 <div class="card"><h2>Oggi</h2>${L.map(f=>`<div class="item"><div><b>${esc(f.n)}</b><div class="mut">${f.k} kcal · P ${f.pr} · C ${f.c} · G ${f.f}</div></div><button class="x" onclick="delFood('${f.id}')">Elimina</button></div>`).join("")||'<p class="mut">Ancora nulla registrato oggi.</p>'}</div>`}
function addFood(){const nm=v("fn"),pr=n("fp"),c=n("fc"),f=n("ff");let k=n("fk");if(!k)k=Math.round(pr*4+c*4+f*9);if(!nm||!k)return;

function addWeight(){const kg=n("wk");if(!kg)return;const f=$("wf").files[0];
 const done=img=>{S.w.push({id:uid(),d:day(),kg,img});S.w.sort((a,b)=>a.d<b.d?-1:1);save();render()};

async function fput(id,b){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}

function vst(o){const x=num(o.v);if(x==null)return 0;if(o.lo!=null&&x<o.lo)return -1;if(o.hi!=null&&x>o.hi)return 1;return 0}
const rgTxt=o=>o.lo!=null&&o.hi!=null?`${o.lo}–${o.hi}`:o.hi!=null?`fino a ${o.hi}`:o.lo!=null?`da ${o.lo}`:"non indicato";
function params(){const M={};S.docs.forEach(d=>(d.vals||[]).forEach(o=>{const k=nk(o.n);(M[k]=M[k]||{n:o.n,h:[]}).h.push({...o,d:d.d})}));
 return Object.values(M).map(p=>{p.h.sort((a,b)=>a.d<b.d?-1:1);p.l=p.h[p.h.length-1];p.s=vst(p.l);return p})}
function alertsN(){const soon=ld(new Date(Date.now()+7*864e5));return params().filter(p=>p.s).length+S.docs.filter(x=>x.t=="imp"&&!x.done&&x.x&&x.x<=soon).length}
function rbar(o){const x=num(o.v),lo=o.lo,hi=o.hi;if(x==null||(lo==null&&hi==null))return"";
 const sp=lo!=null&&hi!=null?(hi-lo)||1:Math.abs(hi??lo)||1;let a=(lo??Math.min(0,hi-sp))-sp*.4,b=(hi??lo+sp)+sp*.4;a=Math.min(a,x-sp*.1);b=Math.max(b,x+sp*.1);
 const P=z=>((z-a)/(b-a)*100).toFixed(1);const L=lo!=null?P(lo):0,R=hi!=null?P(hi):100,s=vst(o);
 return `<div class="rb" role="img" aria-label="${s?(s>0?"Sopra":"Sotto")+" il riferimento":"Nella norma"}"><i style="left:${L}%;width:${R-L}%"></i><b style="left:${P(x)}%;background:${s?"var(--bad)":"var(--ok)"}"></b></div>`}
function spark(H,o){if(H.length<2)return"";const X=H.map(h=>h.x),lim=[o.lo,o.hi].filter(z=>z!=null);let mn=Math.min(...X,...lim),mx=Math.max(...X,...lim);const pd=(mx-mn)*.15||1;mn-=pd;mx+=pd;

 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Andamento nel tempo">${band}<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${H[i].s?"var(--bad)":"var(--ac)"}"/>`).join("")}</svg>`}
function pCard(p,i){const l=p.l,pr=p.h.length>1?p.h[p.h.length-2]:null,x=num(l.v),px=pr?num(pr.v):null,u=esc(l.u||"");
 const st=p.s?`<span class="pill" style="color:var(--bad)">${p.s>0?"Alto":"Basso"}</span>`:x!=null&&(l.lo!=null||l.hi!=null)?`<span class="pill" style="color:var(--ok)">Nella norma</span>`:"";

/* Dati incollati: un oggetto o un elenco nel formato che Claude restituisce dalla foto */
const TY={impegnativa:"imp",imp:"imp",risultato:"res",res:"res",esame:"res",visita:"vis",vis:"vis"};
const isoD=s=>{s=String(s||"").trim();const m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:/^\d{4}-\d{2}-\d{2}$/.test(s)?s:""};
function pj(txt){txt=String(txt||"").replace(/```(json)?/gi,"").trim();if(!txt)return null;const a=txt.indexOf(txt.match(/[\[{]/)?.[0]);if(a<0)return null;
 let J;try{J=JSON.parse(txt.slice(a))}catch(e){return null}J=(Array.isArray(J)?J:[J]).filter(o=>o&&typeof o=="object");if(!J.length)return null;
 return J.map(o=>({t:TY[nk(o.tipo||"")]||((o.valori||[]).length?"res":"imp"),n:o.titolo||"",d:isoD(o.data),x:isoD(o.scadenza),note:o.note||"",lab:o.laboratorio||"",
  f:{med:o.medico||"",nre:String(o.nre||"").replace(/\s/g,""),pri:String(o.priorita||"").trim().toUpperCase().slice(0,1),ese:o.esenzione||"",que:o.quesito||"",
   pres:(o.prestazioni||[]).map(p=>({c:p.codice||"",n:p.nome||String(p),q:+p.quantita||1}))},
  ref:String(o.impegnativa_nre||"").replace(/\s/g,""),
  vals:(o.valori||[]).filter(z=>z&&z.nome).map(z=>({n:String(z.nome),v:String(z.valore??"").trim(),u:z.unita||"",lo:num(z.min),hi:num(z.max)}))}))}
function fillJ(){const J=pj($("dj").value),o=$("djs");if(!$("dj").value.trim()){o.textContent="";return}
 if(!J){o.innerHTML='<span style="color:var(--bad)">Testo non riconosciuto: incolla tutto il blocco che ti ho dato.</span>';return}
 const a=J[0];$("dt").value=a.t;if(a.n)$("dn").value=a.n;if(a.d)$("dd").value=a.d;if(a.x)$("dx").value=a.x;if(a.note)$("dnote").value=a.note;
 const nv=J.reduce((s,o)=>s+o.vals.length,0),bad=J.reduce((s,o)=>s+o.vals.filter(vst).length,0),np=J.reduce((s,o)=>s+o.f.pres.length,0);
 o.innerHTML=`✓ ${J.length==1?DL[a.t]:J.length+" documenti"}${np?` · ${np} prestazioni`:""}${nv?` · ${nv} valori`:""}${bad?` · <b style="color:var(--bad)">${bad} fuori norma</b>`:""}. Controlla i campi e salva.`}
async function addDoc(){const raw=v("dj"),J=pj(raw),nm=v("dn"),t=v("dt"),fs=[...$("df").files];
 if(raw&&!J){alert("Non riesco a leggere i dati incollati: copia tutto il blocco che ti ho dato.");return}
 if(!J&&!nm&&!fs.length)return;
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 try{const files=[];for(const f of fs){if(f.size>25e6){alert(f.name+" è troppo grande (max 25 MB).");continue}const isI=f.type.startsWith("image/");const b=isI?await imgBlob(f):f;const id=uid();await fput(id,b);files.push({id,name:f.name,type:isI?"image/jpeg":f.type})}
 const L=J||[{f:{},vals:[]}];
 L.forEach((o,i)=>{const first=i==0,ty=first?t:o.t;
  const doc={id:uid(),t:ty,n:(first?nm:o.n)||o.n||"Documento",d:(first?v("dd"):o.d)||o.d||day(),x:ty=="imp"?((first?v("dx"):o.x)||""):"",note:(first?v("dnote"):o.note)||"",done:0,files:first?files:[]};
  if(ty=="imp"&&J)doc.f=o.f;if(ty!="imp"&&o.vals.length){doc.vals=o.vals;if(o.lab)doc.lab=o.lab}
  const same=ty=="imp"&&doc.f&&doc.f.nre&&S.docs.find(d=>d.t=="imp"&&d.f&&d.f.nre==doc.f.nre);
  if(same){Object.assign(same,{n:doc.n,d:doc.d,x:doc.x||same.x,note:doc.note||same.note,f:doc.f});same.files=same.files.concat(doc.files)}else S.docs.push(doc);
  if(ty=="res"&&o.ref){const im=S.docs.find(d=>d.t=="imp"&&d.f&&d.f.nre==o.ref);if(im)im.done=1}});
 save();const bad=L.reduce((s,o)=>s+(o.vals||[]).filter(vst).length,0);dtab=bad?"val":(t=="imp"?"imp":"res");render();window.scrollTo(0,0)}catch(e){alert("Impossibile salvare i file su questo dispositivo.")}}
function togDone(id){const d=S.docs.find(x=>x.id==id);d.done=d.done?0:1;save();render()}
async function delDoc(id){if(!confirm("Eliminare il documento e i suoi file?"))return;const d=S.docs.find(x=>x.id==id);for(const f of d.files){try{await fdel(f.id)}catch(e){}}S.docs=S.docs.filter(x=>x.id!=id);save();render()}
async function viewDoc(fid){let m;S.docs.forEach(d=>d.files.forEach(f=>{if(f.id==fid)m=f}));
 try{const b=await fget(fid);if(!b)throw 0;const u=URL.createObjectURL(b),V=$("viewer");
 V.innerHTML=`<div class="row" style="flex:0 0 auto;margin-bottom:8px;flex-wrap:nowrap"><span style="color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}</span><button onclick="closeV()" style="flex:0 0 auto">Chiudi</button></div>`+(m.type=="application/pdf"?`<iframe src="${u}" title="PDF"></iframe>`:`<img src="${u}" alt="Documento">`);V.style.display="flex";V.dataset.u=u}catch(e){alert("File non trovato su questo dispositivo.")}}
function closeV(){const V=$("viewer");try{URL.revokeObjectURL(V.dataset.u)}catch(e){}V.style.display="none";V.innerHTML=""}
